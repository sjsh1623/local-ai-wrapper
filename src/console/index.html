<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morningmate Issue Solver</title>
<style>
  /* Apple 디자인 언어(HIG)를 그대로 따른다: 시스템 컬러, 3단계 label,
     systemFill, 연속 곡률 느낌의 큰 radius, 재질(material)은 실제로 콘텐츠가
     그 아래로 스크롤되는 곳에만. 장식용 블러는 쓰지 않는다. */
  :root{
    color-scheme:light dark;

    /* 한 벌의 face가 라틴과 한글을 모두 덮어야 한 문장이 두 폰트로 갈리지 않는다.
       macOS에서는 SF Pro + Apple SD Gothic Neo가 잡히고, Windows에서는
       Pretendard(설치돼 있으면) → Malgun Gothic으로 떨어진다. system-ui와
       Segoe UI를 앞에 두지 않는 이유가 바로 이것: 그러면 Segoe가 라틴을,
       Malgun이 한글을 가져가 굵기와 x-height가 어긋난다. 사내 전용 화면이라
       웹폰트는 여전히 쓰지 않는다 — 네트워크를 기다리지 않는다. */
    --sf:-apple-system,BlinkMacSystemFont,"SF Pro Text","Pretendard Variable",Pretendard,
        "Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",sans-serif;
    --mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"D2Coding",monospace;

    /* 배경 · 재질 */
    --bg:#F2F2F7;               /* systemGroupedBackground */
    --surface:#FFFFFF;
    --material:rgba(255,255,255,.72);
    --material-side:rgba(242,242,247,.78);
    --island:#1C1C1E;           /* Live Activity는 라이트 모드에서도 어둡다 */
    --island-rule:rgba(255,255,255,.08);

    /* systemFill 1·2·3 */
    --fill:rgba(120,120,128,.12);
    --fill-2:rgba(120,120,128,.08);
    --fill-3:rgba(120,120,128,.05);

    --sep:rgba(60,60,67,.16);
    --sep-strong:rgba(60,60,67,.29);

    /* label 1·2·3 */
    --label:#1D1D1F;
    --label-2:rgba(60,60,67,.62);
    --label-3:rgba(60,60,67,.34);

    /* 시스템 컬러 — 텍스트용은 대비를 위해 accessible 변형을 쓴다 */
    --blue:#007AFF;      --blue-fill:#007AFF;   --blue-tint:rgba(0,122,255,.12);
    --green:#248A3D;     --green-fill:#34C759;  --green-tint:rgba(52,199,89,.14);
    --red:#D70015;       --red-fill:#FF3B30;    --red-tint:rgba(255,59,48,.11);
    --orange:#B25000;    --orange-fill:#FF9500; --orange-tint:rgba(255,149,0,.13);
    --gray:#8E8E93;

    --focus:rgba(0,122,255,.35);
    --shadow-1:0 0 0 .5px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.05);
    --shadow-2:0 0 0 .5px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.10);

    --r-card:12px; --r-ctrl:8px; --r-row:10px; --r-island:18px;

    /* 시트/팝오버에 쓰이는 Apple의 표준 이징 */
    --ease:cubic-bezier(.32,.72,0,1);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#000000;
      --surface:#1C1C1E;
      --material:rgba(28,28,30,.72);
      --material-side:rgba(0,0,0,.72);
      --island:#000000;
      --island-rule:rgba(255,255,255,.10);
      --fill:rgba(120,120,128,.24);
      --fill-2:rgba(120,120,128,.18);
      --fill-3:rgba(120,120,128,.12);
      --sep:rgba(84,84,88,.48);
      --sep-strong:rgba(84,84,88,.65);
      --label:#F5F5F7;
      --label-2:rgba(235,235,245,.6);
      --label-3:rgba(235,235,245,.3);
      --blue:#0A84FF;   --blue-fill:#0A84FF;   --blue-tint:rgba(10,132,255,.22);
      --green:#30D158;  --green-fill:#30D158;  --green-tint:rgba(48,209,88,.18);
      --red:#FF453A;    --red-fill:#FF453A;    --red-tint:rgba(255,69,58,.18);
      --orange:#FF9F0A; --orange-fill:#FF9F0A; --orange-tint:rgba(255,159,10,.18);
      --focus:rgba(10,132,255,.45);
      --shadow-1:0 0 0 .5px rgba(0,0,0,.5);
      --shadow-2:0 0 0 .5px rgba(0,0,0,.6),0 8px 24px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#000000;
    --surface:#1C1C1E;
    --material:rgba(28,28,30,.72);
    --material-side:rgba(0,0,0,.72);
    --island:#000000;
    --island-rule:rgba(255,255,255,.10);
    --fill:rgba(120,120,128,.24);
    --fill-2:rgba(120,120,128,.18);
    --fill-3:rgba(120,120,128,.12);
    --sep:rgba(84,84,88,.48);
    --sep-strong:rgba(84,84,88,.65);
    --label:#F5F5F7;
    --label-2:rgba(235,235,245,.6);
    --label-3:rgba(235,235,245,.3);
    --blue:#0A84FF;   --blue-fill:#0A84FF;   --blue-tint:rgba(10,132,255,.22);
    --green:#30D158;  --green-fill:#30D158;  --green-tint:rgba(48,209,88,.18);
    --red:#FF453A;    --red-fill:#FF453A;    --red-tint:rgba(255,69,58,.18);
    --orange:#FF9F0A; --orange-fill:#FF9F0A; --orange-tint:rgba(255,159,10,.18);
    --focus:rgba(10,132,255,.45);
    --shadow-1:0 0 0 .5px rgba(0,0,0,.5);
    --shadow-2:0 0 0 .5px rgba(0,0,0,.6),0 8px 24px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--label);
    font-family:var(--sf);
    /* 14px/1.5. 안티에일리어싱은 켜지 않는다 — Malgun Gothic은 Windows 힌팅
       기준이라 얇아지면 획이 끊겨 보인다. */
    font-size:14px;font-weight:400;line-height:1.5;
    letter-spacing:-.005em;
    overflow:hidden;                 /* 패널이 스크롤하고 페이지는 스크롤하지 않는다 */
  }
  .mono{font-family:var(--mono)}
  .lang-ko .en{display:none}
  .lang-en .ko{display:none}

  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--fill);border-radius:99px;
    border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--sep-strong);background-clip:content-box}

  :focus-visible{outline:none;box-shadow:0 0 0 3.5px var(--focus)}

  #app{height:100dvh;display:flex;flex-direction:column;min-height:0}

  /* ── 툴바 ─────────────────────────────────────────────────── */
  .bar{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:14px;align-items:center;
       justify-content:space-between;padding:0 16px;min-height:52px;
       border-bottom:1px solid var(--sep);background:var(--bg)}
  .mark{display:flex;align-items:center;gap:10px;min-width:0}
  .glyph{width:22px;height:22px;border-radius:5px;flex:0 0 auto;display:grid;place-items:center;
         background:linear-gradient(180deg,#3F9BFF,var(--blue-fill));color:#fff;
         box-shadow:0 1px 2px rgba(0,0,0,.18)}
  .mark .sub{font-size:15px;font-weight:600;letter-spacing:-.015em;color:var(--label);
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mark .app{font-size:12.5px;color:var(--label-3);white-space:nowrap}
  .barright{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--green)}
  .live .txt{color:var(--label-2)}
  .live i{width:7px;height:7px;border-radius:50%;background:currentColor;display:block;flex:0 0 auto}
  @media (prefers-reduced-motion:no-preference){
    .live i{animation:breathe 2.4s ease-in-out infinite}
    @keyframes breathe{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.72)}}
  }

  /* ── 세그먼티드 컨트롤 (언어 · 필터) ──────────────────────── */
  .seg{display:inline-flex;gap:2px;padding:2px;background:var(--fill-2);border-radius:9px}
  .seg button{font-family:inherit;font-size:12.5px;font-weight:600;letter-spacing:-.005em;
    padding:5px 12px;border:0;border-radius:7px;background:transparent;color:var(--label-2);
    cursor:pointer;transition:background .18s var(--ease),color .18s var(--ease)}
  .seg button:hover{color:var(--label)}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--label);box-shadow:var(--shadow-1)}
  .seg button:active{transform:scale(.97)}
  .seg button .n{font-variant-numeric:tabular-nums;color:var(--label-3);margin-left:3px;font-weight:500}
  .seg button[aria-pressed="true"] .n{color:var(--label-2)}

  /* ── 지표 카드 ────────────────────────────────────────────── */
  .stats{flex:0 0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));
         gap:10px;padding:14px 16px}
  .stat{position:relative;background:var(--surface);border-radius:var(--r-card);
        padding:13px 15px 14px;box-shadow:var(--shadow-1);display:flex;flex-direction:column;gap:7px}
  .stat .lbl{font-size:12.5px;font-weight:600;color:var(--label-2);letter-spacing:-.005em}
  .stat .val{font-size:29px;font-weight:600;letter-spacing:-.035em;line-height:1;
             font-variant-numeric:tabular-nums}
  .stat .ico{position:absolute;top:12px;right:13px;color:var(--label-3);display:block}
  .stat.run .val,.stat.run .ico{color:var(--blue)}
  .stat.fail .val,.stat.fail .ico{color:var(--red)}
  .stat.done .val,.stat.done .ico{color:var(--green)}
  @media (max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}}

  /* ── 본문 2단 ─────────────────────────────────────────────── */
  /* flex:1 + min-height:0 이 있어야 그리드가 콘텐츠가 아니라 뷰포트에 맞춰 줄어든다. */
  .ops{display:grid;grid-template-columns:300px minmax(0,1fr);flex:1;min-height:0;
       border-top:1px solid var(--sep)}
  @media (max-width:900px){.ops{grid-template-columns:1fr}}

  /* ── 사이드바 ─────────────────────────────────────────────── */
  .joblist{background:var(--bg);display:flex;flex-direction:column;min-width:0;min-height:0;
           border-right:1px solid var(--sep)}
  @media (max-width:900px){.joblist{border-right:0;border-bottom:1px solid var(--sep);max-height:38vh}}
  /* 아래로 목록이 실제로 스크롤해 지나가므로 여기의 재질은 진짜다 */
  .filterbar{padding:10px;position:relative;z-index:2;
             background:var(--material-side);backdrop-filter:saturate(180%) blur(20px);
             -webkit-backdrop-filter:saturate(180%) blur(20px);
             border-bottom:1px solid var(--sep)}
  .filters{display:flex;width:100%}
  .filters button{flex:1;padding:5px 6px;white-space:nowrap}
  .rows{overflow-y:auto;overscroll-behavior:contain;flex:1;min-height:0;padding:6px 8px 12px}
  .row{display:block;width:100%;text-align:left;border:0;border-radius:var(--r-row);
       background:transparent;padding:9px 11px;cursor:pointer;color:inherit;font:inherit;
       transition:background .16s var(--ease)}
  .row + .row{margin-top:2px}
  .row:hover{background:var(--fill-3)}
  .row[aria-current="true"]{background:var(--blue-tint);box-shadow:inset 0 0 0 1px rgba(0,122,255,.16)}
  .row .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .row .repo{font-family:var(--mono);font-size:11.5px;color:var(--label-2);
              overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .alert{font-weight:600;font-size:13.5px;letter-spacing:-.012em;margin-top:3px;color:var(--label);
              overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .r3{display:flex;align-items:center;gap:10px;margin-top:9px}
  .row .el{font-family:var(--mono);font-size:11.5px;color:var(--label-3);
           margin-left:auto;font-variant-numeric:tabular-nums}
  .empty{padding:26px 16px;text-align:center;color:var(--label-2);font-size:13px;line-height:1.55}
  .empty b{display:block;color:var(--label);font-weight:600;font-size:13.5px;margin-bottom:3px}

  .pill{font-size:11px;font-weight:600;letter-spacing:-.005em;padding:2px 8px;
        border-radius:99px;white-space:nowrap}
  .pill.running{background:var(--blue-tint);color:var(--blue)}
  .pill.queued{background:var(--fill);color:var(--label-2)}
  .pill.failed{background:var(--red-tint);color:var(--red)}
  .pill.succeeded{background:var(--green-tint);color:var(--green)}

  /* 9단계 레일 — 캡슐 세그먼트 */
  .mini{display:flex;gap:2px;flex:1;max-width:118px}
  .mini i{height:4px;flex:1;background:var(--fill);border-radius:99px}
  .mini i.on{background:var(--blue-fill);opacity:.55}
  .mini i.cur{background:var(--blue-fill)}
  .mini i.bad{background:var(--red-fill)}

  /* ── 상세 ─────────────────────────────────────────────────── */
  .thread{background:var(--surface);display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
  .thead{padding:16px 20px 14px;display:flex;flex-wrap:wrap;gap:12px;
         align-items:flex-start;justify-content:space-between}
  .thead h2{margin:0;font-size:19px;font-weight:600;letter-spacing:-.022em;line-height:1.25}
  .thead .meta{font-size:11.5px;color:var(--label-2);margin-top:8px;
               display:flex;flex-wrap:wrap;gap:5px}
  .thead .meta span{font-family:var(--mono);background:var(--fill-2);border-radius:6px;padding:2px 7px}
  .thead .meta b{color:var(--label);font-weight:600}
  .thead .meta a{color:var(--blue);text-decoration:none;font-weight:600}
  .cancel{font-family:inherit;font-size:13px;font-weight:600;letter-spacing:-.008em;
          padding:6px 14px;border:0;border-radius:var(--r-ctrl);color:var(--red);
          background:var(--fill);cursor:pointer;transition:background .16s var(--ease)}
  .cancel:hover{background:var(--red-tint)}
  .cancel:active{transform:scale(.97)}
  .cancel[disabled]{opacity:.4;cursor:not-allowed;background:var(--fill);color:var(--label-3)}

  /* ── Live Activity ────────────────────────────────────────── */
  /* 이 화면의 주인공. 실행 중인 작업 하나를 다이내믹 아일랜드처럼
     라이트/다크 상관없이 어두운 캡슐로 띄운다. */
  .island{margin:0 20px;padding:12px 16px 13px;border-radius:var(--r-island);
          background:var(--island);box-shadow:var(--shadow-2),inset 0 0 0 .5px var(--island-rule);
          display:flex;align-items:center;gap:13px;color:#fff}
  .island:empty{display:none}
  .ibadge{width:22px;height:22px;flex:0 0 auto;display:grid;place-items:center;color:rgba(255,255,255,.55)}
  .island.live .ibadge{color:#0A84FF}
  .island.ok .ibadge{color:#30D158}
  .island.bad .ibadge{color:#FF453A}
  @media (prefers-reduced-motion:no-preference){
    .island.live .ibadge svg{animation:spin 1.1s linear infinite;transform-origin:50% 50%}
    @keyframes spin{to{transform:rotate(360deg)}}
  }
  .imain{flex:1;min-width:0}
  .itop{display:flex;align-items:baseline;gap:10px}
  .istage{font-size:14px;font-weight:600;letter-spacing:-.012em;color:#fff;
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .icount{font-family:var(--mono);font-size:11.5px;color:rgba(255,255,255,.42);
          font-variant-numeric:tabular-nums;flex:0 0 auto}
  .island .el{font-family:var(--mono);font-size:12.5px;color:rgba(255,255,255,.78);
              margin-left:auto;font-variant-numeric:tabular-nums;flex:0 0 auto}
  .irail{display:flex;gap:3px;margin-top:9px}
  .irail i{height:4px;flex:1;border-radius:99px;background:rgba(255,255,255,.16)}
  .irail i.on{background:rgba(255,255,255,.82)}
  .irail i.cur{background:#0A84FF;box-shadow:0 0 9px rgba(10,132,255,.75)}
  .irail i.bad{background:#FF453A;box-shadow:0 0 9px rgba(255,69,58,.6)}
  @media (prefers-reduced-motion:no-preference){
    .irail i.cur{animation:glow 1.8s ease-in-out infinite}
    @keyframes glow{0%,100%{opacity:1}50%{opacity:.45}}
  }

  /* ── 타임라인 ─────────────────────────────────────────────── */
  /* 하단 nowbar가 이 위를 덮으므로 그만큼 아래 여백을 준다 */
  .msgs{padding:16px 20px 62px;overflow-y:auto;flex:1;min-height:0;
        display:flex;flex-direction:column;gap:14px}
  .msgs .empty{margin:auto 0}

  .msg{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px}
  .msg .t{font-family:var(--mono);font-size:11.5px;color:var(--label-3);
          padding-top:2px;font-variant-numeric:tabular-nums}
  .msg .c{min-width:0}
  .who{font-size:12px;font-weight:600;letter-spacing:-.005em;margin-bottom:5px;
       display:flex;align-items:center;gap:6px;color:var(--label-2)}
  .bubble{background:var(--fill-3);padding:11px 14px;border-radius:var(--r-card)}
  .bubble p{margin:0;font-size:13.5px;color:var(--label);line-height:1.55}
  .bubble p + p{margin-top:7px}
  .bubble .kv{font-size:11.5px;margin-top:9px;display:flex;flex-wrap:wrap;gap:5px}
  .bubble .kv span{font-family:var(--mono);background:var(--fill);border-radius:6px;
                   padding:2px 7px;color:var(--label-2)}
  .bubble .kv b{color:var(--label);font-weight:600}
  .bubble a{color:var(--blue);text-decoration:none;text-underline-offset:2px}
  .bubble a:hover{text-decoration:underline}

  .msg.inbound .who{color:var(--orange)}
  .msg.inbound .bubble{background:var(--orange-tint)}
  .msg.inbound .bubble .kv span{background:rgba(255,149,0,.14)}
  .msg.stage .bubble{background:var(--fill-3)}
  /* 도구 출력은 로그다 — Terminal처럼 어두운 카드에 고정폭으로 둔다 */
  .msg.tool .who{color:var(--label-3)}
  .msg.tool .bubble{background:var(--island);color:rgba(255,255,255,.86);
                    font-family:var(--mono);font-size:12px;line-height:1.65;
                    overflow-x:auto;box-shadow:inset 0 0 0 .5px var(--island-rule)}
  .msg.tool .bubble p{color:inherit;font-family:inherit;font-size:inherit}
  .msg.tool .bubble .kv span{background:rgba(255,255,255,.1);color:rgba(255,255,255,.7)}
  .msg.tool .bubble .kv b{color:#fff}
  .msg.tool .bubble a{color:#0A84FF}
  .msg.notify .who{color:var(--label-3)}
  .msg.notify .bubble{background:transparent;border-left:2px solid var(--sep-strong);
                      border-radius:0;padding:1px 0 1px 12px}
  .msg.notify .bubble p{font-size:12.5px;color:var(--label-2)}
  .msg.result .who{color:var(--green)}
  .msg.result .bubble{background:var(--green-tint)}
  .msg.error .who{color:var(--red)}
  .msg.error .bubble{background:var(--red-tint)}

  /* ── 하단 상태 바 ─────────────────────────────────────────── */
  /* 타임라인이 이 아래로 지나간다 — 그래서 재질이 실제로 필요하다 */
  .nowbar{position:absolute;left:0;right:0;bottom:0;padding:13px 20px;
          display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--label-2);
          background:var(--material);backdrop-filter:saturate(180%) blur(20px);
          -webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--sep)}
  .nowbar:empty{display:none}
  .dots{display:inline-flex;gap:3px;flex:0 0 auto}
  .dots i{width:5px;height:5px;border-radius:50%;background:var(--blue);display:block}
  @media (prefers-reduced-motion:no-preference){
    .dots i{animation:bob 1.3s ease-in-out infinite}
    .dots i:nth-child(2){animation-delay:.16s}
    .dots i:nth-child(3){animation-delay:.32s}
    @keyframes bob{0%,100%{opacity:.22}50%{opacity:1}}
  }
  .nowbar.done .dots{display:none}

  /* ── 원본 웹훅 ────────────────────────────────────────────── */
  /* 평소에는 접어둔다. 판단 근거로 필요할 때만 펴보는 물건이지,
     매번 읽을 것이었다면 위의 키/값 줄에 있었을 것이다. */
  .raw{margin-top:10px;border-top:1px solid var(--island-rule);padding-top:9px}
  .raw summary{cursor:pointer;font-size:11.5px;color:var(--label-3);
               list-style:none;display:inline-flex;align-items:center;gap:5px;
               user-select:none}
  .raw summary::-webkit-details-marker{display:none}
  .raw summary::before{content:'';width:0;height:0;border-left:4px solid currentColor;
                       border-top:3.5px solid transparent;border-bottom:3.5px solid transparent;
                       transition:transform .15s var(--ease)}
  .raw[open] summary::before{transform:rotate(90deg)}
  .raw summary:hover{color:var(--label-2)}
  .raw pre{margin:9px 0 0;padding:10px 12px;border-radius:8px;background:var(--fill-2);
           font-family:var(--mono);font-size:11px;line-height:1.55;color:var(--label-2);
           max-height:320px;overflow:auto;white-space:pre;
           box-shadow:inset 0 0 0 .5px var(--island-rule)}

  /* ── 푸터 ─────────────────────────────────────────────────── */
  .foot{flex:0 0 auto;padding:11px 16px;color:var(--label-3);font-size:11.5px;
        display:flex;flex-wrap:wrap;gap:6px 16px;border-top:1px solid var(--sep);background:var(--bg)}
  .foot b{font-family:var(--mono);color:var(--label-2);font-weight:500;
          background:var(--fill-2);border-radius:5px;padding:1px 6px;margin-right:5px}
  @media (max-width:900px){.foot{display:none}}
</style>
</head>
<body>
<div id="app" class="lang-ko">

  <div class="bar">
    <div class="mark">
      <span class="glyph" aria-hidden="true">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2 4 14h7l-1 8 9-12h-7z"/>
        </svg>
      </span>
      <span class="sub">Morningmate Issue Solver</span>
      <span class="app"><span class="ko">SigNoz 알럿 → 조사 → PR</span><span class="en">SigNoz alert → investigate → PR</span></span>
    </div>
    <div class="barright">
      <span class="live"><i></i> <span class="txt"><span class="ko">실시간 연결됨</span><span class="en">Live</span></span></span>
      <div class="seg langswitch" role="group" aria-label="Language">
        <button type="button" data-lang="ko" aria-pressed="true">한국어</button>
        <button type="button" data-lang="en" aria-pressed="false">English</button>
      </div>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="ops">
    <aside class="joblist" aria-label="Jobs">
      <div class="filterbar">
        <div class="seg filters" role="group" id="filters"></div>
      </div>
      <div class="rows" id="rows"></div>
    </aside>

    <section class="thread" aria-live="polite">
      <div class="thead">
        <div>
          <h2 id="t-alert">—</h2>
          <div class="meta" id="t-meta"></div>
        </div>
        <button class="cancel" id="t-cancel" type="button"><span class="ko">작업 취소</span><span class="en">Cancel job</span></button>
      </div>
      <div class="island" id="t-step"></div>
      <div class="msgs" id="t-msgs"></div>
      <div class="nowbar" id="t-now"></div>
    </section>
  </div>

  <div class="foot">
    <span><b>GET /</b><span class="ko">읽기 전용 콘솔</span><span class="en">read-only console</span></span>
    <span><b>GET /v1/stream</b><span class="ko">전역 SSE · 재연결 시 최근 200건 리플레이</span><span class="en">global SSE · replays the last 200 on reconnect</span></span>
    <span><b>POST /v1/jobs/:id/cancel</b><span class="ko">이 화면에서 가능한 유일한 쓰기 동작</span><span class="en">the only write this screen can perform</span></span>
  </div>
</div>

<script src="/console/console.js"></script>
</body>
</html>
